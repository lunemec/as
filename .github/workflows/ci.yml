name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.x", stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Verify v2 module path
        run: test "$(go list -m)" = github.com/lunemec/as/v2
      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Vet
        run: go vet ./...
      - name: Fuzz integer conversions
        if: matrix.go-version == 'stable'
        run: go test -run '^$' -fuzz=FuzzIntegerConversions -fuzztime=5s ./...
      - name: Test 386
        run: go test ./...
        env:
          CGO_ENABLED: 0
          GOARCH: 386
      - name: Check module files
        if: matrix.go-version == '1.24.x'
        run: |
          go mod tidy -go=1.24
          git diff --exit-code -- go.mod go.sum

  architectures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [386, amd64, arm, arm64, riscv64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Compile tests
        run: go test -run '^$' -exec /bin/true ./...
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
